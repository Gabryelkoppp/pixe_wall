services:
  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pixel-net]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pixel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixelpass}
      POSTGRES_DB: pixelwall
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixel -d pixelwall"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pixel-net]

  app:
    build: .
    image: pixel-wall:1.0
    environment:
      REDIS_URL: redis://cache:6379
      DATABASE_URL: postgres://pixel:${POSTGRES_PASSWORD:-pixelpass}@db:5432/pixelwall
      WIDTH: ${WIDTH:-32}
      HEIGHT: ${HEIGHT:-32}
      COOLDOWN_SECONDS: ${COOLDOWN_SECONDS:-5}
      MAX_PIXELS_PER_USER: ${MAX_PIXELS_PER_USER:-0}
      MAX_BATCH: ${MAX_BATCH:-10}
      ADMIN_KEY: ${ADMIN_KEY:-host123}
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    expose:
      - "3000"          
    networks: [pixel-net]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [pixel-net]

  tests:
    image: pixel-wall:1.0
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./test:/app/test:ro
    environment:
      WS_URL: ws://nginx:80/ws
    command: ["node", "--test", "test/smoke.test.js"]
    depends_on:
      - nginx
    networks: [pixel-net]

volumes:
  redisdata:
  pgdata:

networks:
  pixel-net:
